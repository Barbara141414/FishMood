name: Deploy FishMood Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          rm -rf public
          mkdir -p public/webui
          cp -R site public/site
          cp -R webui/dist public/webui/dist
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=site/index.html">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FishMood · 我的鱼儿朋友们</title>
          </head>
          <body><p><a href="site/index.html">进入 FishMood 主界面</a></p></body>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
